# Full sv0-toolchain: submodules + unified scripts/sv0 harness (SML, C, VM, bootstrap-in-sv0, golden,
# doctests) + sv0-mcp. `sv0 test` / `test-guards` include Python checks: block comments, sv0doc baseline,
# task/*.Rmd YAML + optional sv0-track anchors (verify_task_rmd_tracking.py), README pinned sv0c SHA vs git submodule (verify_readme_sv0c_gitlink.py), VM bytecode
# parity manifest ⊆ bootstrap, milestone-orientation JSON + primary_tasks path existence
# (verify_milestone_orientation.py), and JSON primary_tasks cited in sv0-toolchain-workspace.Rmd
# (verify_workspace_milestone_table.py: forward + reverse vs `## milestone and area tasks`).
# Early CI step runs those Python checks before SML install.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Use HTTPS for SSH-form submodule URLs in .gitmodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ubuntu-22.04's default python3 is 3.10, which predates the stdlib
      # `tomllib` module (added in 3.11) that native_exe_config.py imports
      # for sv0.toml discovery (NEX-043/062). Never caught before because
      # ./scripts/sv0 test had never once reached this far in CI (KC-001/
      # KC-002/KC-005 always aborted the run earlier).
      - name: Set up Python 3.11+ (native_exe_config.py needs stdlib tomllib)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Milestone orientation + workspace index consistency (no SML)
        run: |
          python3 scripts/verify_milestone_orientation.py --root .
          python3 scripts/verify_workspace_milestone_table.py --root .
          python3 scripts/milestone_orient.py list

      - name: Tier-2 VM parity policy subset (M3-S-045, no SML)
        run: python3 scripts/verify_vm_parity_tier2_policy.py --root .

      - name: Cache SML/NJ install
        uses: actions/cache@v4
        id: smlnj-cache
        with:
          path: ~/smlnj-110.99.9
          key: smlnj-110.99.9-${{ runner.os }}-${{ runner.arch }}-curl-v2

      - name: Install SML/NJ (110.99.x; apt package is too old)
        run: bash scripts/ci-install-smlnj.sh

      - name: Install z3 (M4 contract verification solver)
        run: sudo apt-get update && sudo apt-get install -y z3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock

      - name: Compile smoke (sv0c + sv0vm)
        run: ./scripts/sv0 check

      - name: Legacy sml-legacy CM.make (M3-S-052)
        run: make -C sv0c legacy-bootstrap-check

      - name: Full sv0 test harness (./scripts/sv0 test)
        run: ./scripts/sv0 test

      - name: Native-exe ASan/UBSan full behavior corpus (NEX-050c)
        run: PYTHONPATH=scripts python3 scripts/native_exe_sanitizer_corpus.py --root .

      - name: Mega-TU corpus parity (composed sv0 compiler covers self-host-sv0-loop 98/98)
        run: ./scripts/sv0-megatu-corpus-parity.sh --verbose

      - name: sv0-mcp tests (pytest when uv available)
        run: ./scripts/sv0 test-mcp

  # NEX-051d (PORT-005): a genuinely separate host-compiler-family leg,
  # not just the default `cc` the `verify` job above uses. Scoped to the
  # native-exe checks specifically (not the full ./scripts/sv0 test suite)
  # to keep this leg's own SML/NJ re-bootstrap cost proportionate -- the
  # `verify` job above already proves the whole toolchain end to end on
  # GCC/default-cc; this job's only new claim is "the native-exe pipeline
  # also passes under Clang, in both dev and release profile."
  native-exe-clang:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CC: clang
    steps:
      - name: Use HTTPS for SSH-form submodule URLs in .gitmodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache SML/NJ install
        uses: actions/cache@v4
        id: smlnj-cache
        with:
          path: ~/smlnj-110.99.9
          key: smlnj-110.99.9-${{ runner.os }}-${{ runner.arch }}-curl-v2

      - name: Install SML/NJ (110.99.x; apt package is too old)
        run: bash scripts/ci-install-smlnj.sh

      - name: Confirm clang is available and selected
        run: clang --version && cc --version

      - name: Build the native mega-TU compiler under Clang
        run: bash scripts/build-sv0-megatu-native.sh

      - name: Native-exe behavior corpus under Clang (NEX-028, dev profile)
        run: PYTHONPATH=scripts python3 scripts/native_exe_behavior_corpus.py --root .

      - name: Native-exe dev-vs-release parity under Clang (NEX-051b/d)
        run: PYTHONPATH=scripts python3 scripts/native_exe_release_parity.py --root .

      - name: Native-exe ASan/UBSan full behavior corpus under Clang (NEX-050c/051d)
        run: PYTHONPATH=scripts python3 scripts/native_exe_sanitizer_corpus.py --root .
