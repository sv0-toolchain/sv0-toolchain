# sv0cov CV-428: what the native runtime's exit-time profile publication
# costs on each managed runner, and how much of it is the two fsync calls
# (scripts/perf_exit_probe.py), for the runtime test driver and for the
# real startup-empty fixture, with a phase trace on Linux. Diagnostic
# evidence for a possible COV-PERF-035 change; not a campaign and not gate
# evidence.

name: Runtime exit-cost probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [linux-x86_64, linux-arm64, macos-x86_64, macos-arm64]
        include:
          - { host: linux-x86_64, runner: ubuntu-24.04 }
          - { host: linux-arm64, runner: ubuntu-24.04-arm }
          - { host: macos-x86_64, runner: macos-15-intel }
          - { host: macos-arm64, runner: macos-15 }
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SV0COV_RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the sv0c and sv0cov submodules only
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 sv0c sv0cov

      - name: Probe
        run: python3 scripts/perf_exit_probe.py --work "$RUNNER_TEMP/exit-probe" | tee "exit-probe-${{ matrix.host }}.json"

      - name: Filesystem under RUNNER_TEMP
        run: |
          if [ "$RUNNER_OS" = Linux ]; then findmnt -T "$RUNNER_TEMP"; else mount | grep -E ' on /( |System/Volumes/Data )'; fi | tee "fs-${{ matrix.host }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: exit-probe-${{ matrix.host }}
          path: |
            exit-probe-*.json
            fs-*.txt
